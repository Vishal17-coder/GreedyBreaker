server.port=8080

# Dual Profile Default: In-memory H2 with PostgreSQL compatibility mode
spring.datasource.url=jdbc:h2:mem:greedybreaker;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# GreedyBreaker Algorithmic Engine Configuration
greedybreaker.engine.binary-path=../engine/build/bin/greedybreaker_cli.exe
greedybreaker.engine.default-timeout-ms=5000
greedybreaker.engine.max-candidates-limit=100000
greedybreaker.engine.max-duration-limit-ms=30000

# Logging
logging.level.com.greedybreaker=INFO
