# Production Profile: External PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/greedybreaker}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# GreedyBreaker Algorithmic Engine Configuration
greedybreaker.engine.binary-path=${GREEDYBREAKER_ENGINE_BIN:/app/bin/greedybreaker_cli}
greedybreaker.engine.default-timeout-ms=10000
greedybreaker.engine.max-candidates-limit=100000
greedybreaker.engine.max-duration-limit-ms=60000
